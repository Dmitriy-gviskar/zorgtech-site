<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZORGTECH — интерактивное оборудование</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="hero">
      <img class="hero__logo" src="./assets/logo-light.png" alt="ZORGTECH" />

      <section class="hero__copy">
        <p class="hero__eyebrow">Российский производитель</p>
        <h1>
          Интерактивное оборудование
          <span>премиального качества</span>
        </h1>
        <p class="hero__description">
          Премиальные устройства для бизнеса<br />
          и общественных пространств.
        </p>
        <div class="hero__actions">
          <a class="button button--primary" href="/catalog">В каталог →</a>
          <a class="button button--secondary" href="/contacts">Обсудить задачу</a>
        </div>
      </section>

      <div class="equipment" aria-label="Интерактивное оборудование ZORGTECH">
        <img class="equipment__kiosk" src="./assets/kiosk.png" alt="Информационный киоск" />
        <img class="equipment__terminal" src="./assets/terminal.png" alt="Интерактивный терминал" />
        <img class="equipment__table" src="./assets/table.png" alt="Интерактивный стол" />
      </div>
    </main>
  </body>
</html>
